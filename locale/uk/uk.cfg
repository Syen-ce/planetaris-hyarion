[tips-and-tricks-item-description]
hyarion-briefing=[planet=hyarion] Планета, утворена з кристалів і лави. З неба падають промені заломлення світла, що руйнують поверхню.\nМожна утилізувати непотрібні предмети, переміщуючи їх безпосередньо в [tile=lava].\nХаріон має власну ракетну шахту та рецепти деталей до неї.
hyarion-refraction=[planet=hyarion] має унікальний спосіб виробництва енергії.\nВикористовуйте [entity=planetaris-big-refraction-ray-collector], щоб зібрати [fluid=planetaris-refraction-light], потім перемістіть їх за допомогою [entity=planetaris-fiber-optics-cable] до [entity=planetaris-refraction-plant].\nВсередині [item=planetaris-fluorite] та [fluid=planetaris-refraction-light] виробляють [fluid=planetaris-pure-light] — використовуйте його для генерації енергії в [entity=planetaris-refraction-generator]\nТакож ви можете виробляти [item=planetaris-charged-fluorite], щоб перенести виробництво рефракційної енергії куди завгодно, але зауважте що він втрачає заряд з часом.
hyarion-unstable-gem=[item=planetaris-unstable-gem] є кращою альтернативою [item=cliff-explosives] з більшим радіусом дії та потужністю.

